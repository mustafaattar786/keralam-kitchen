<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<meta name="robots" content="noindex">
<title>Keralam Kitchen — Admin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding-bottom: 40px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; position: sticky; top: 68px; background: var(--cream); z-index: 15; }
  .tabs button { flex: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .kpi { background: #fff; border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .kpi b { display: block; font-size: 22px; color: var(--green); }
  .kpi span { font-size: 12.5px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 10px; border-bottom: 2px solid var(--line); }
  .bars div { flex: 1; background: var(--green2); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .bars div.c { background: #e9a0a0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.n, th.n { text-align: right; }
  .ocard.stale { border: 3px solid var(--red); }
  .ocard .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .switch input { width: 22px; height: 22px; accent-color: var(--green); }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
